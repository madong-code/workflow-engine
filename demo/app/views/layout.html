<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madong Ingenious v3 工作流引擎 - 流程中心</title>
<link rel="icon" href="data:,">
<!-- Bootstrap 5.3（基础样式层）→ Layui 2.13（表格组件层）→ 自有主题 common.css 最后加载统一覆盖 -->

<link rel="stylesheet" href="/assets/vendor/layui/css/layui.css">

<header class="topbar">

  <div class="user-chip" id="userChip">

    <span id="userDisplayName"></span>
    <span class="caret">&#9660;</span>
    <div class="user-menu" id="userMenu"></div>

<div class="layout">
  <aside class="sidebar">

      <div class="menu-item active" data-page="workspace">

        工作台
      </div>
      <div class="menu-item" data-page="launch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 12h6M12 9v6"/></svg>
        发起申请
      </div>
      <div class="menu-item" data-page="todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        我的待办
      </div>
      <div class="menu-item" data-page="mine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.5 18-4-7.5L3 9.5 21 3z"/></svg>
        我发起的
      </div>
      <div class="menu-item" data-page="done">

      <div class="menu-item" data-page="cc">

        我的抄送
      </div>
      <div class="menu-item" data-page="definitions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="15" width="18" height="5" rx="1.5"/><path d="M7 6.5h.01M7 17.5h.01"/></svg>

      </div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="15" width="6" height="5" rx="1"/><path d="M9 6.5h4.5a4.5 4.5 0 0 1 4.5 4.5V15"/></svg>

      <div class="menu-item" data-page="delegate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="7" r="3"/><circle cx="16.5" cy="17" r="3"/><path d="M7.5 13v-1a2 2 0 0 1 2-2h5.5"/><path d="M13 7.5l2.5 2.5L13 12.5"/><path d="M16.5 11v1a2 2 0 0 1-2 2H9"/><path d="M11 16.5L8.5 14l2.5-2.5"/></svg>
        我的委托
      </div>
      <div class="menu-item" data-page="monitor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        流程监控
      </div>
      <div class="menu-item" data-page="about">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11.5V16"/></svg>
        关于
      </div>
    </nav>
  </aside>

  <!-- 栏目页按需注入容器：fetch /views/{name}.html → 注入 section.page + 执行脚本 -->
  <main id="pageContainer"></main>
</div>

<script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/layui/layui.js"></script>
<script src="/assets/form-templates.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/detail-drawer.js"></script>
<script>
(function () {
  'use strict';

  App.initUserSwitch();

  // 左侧菜单切换（单页内容区，按需加载栏目 HTML）
  document.getElementById('sideMenu').addEventListener('click', (e) => {
    const item = e.target.closest('.menu-item[data-page]');
    if (item) App.openPage(item.dataset.page);
  });

  // 默认进入工作台
  App.openPage('workspace');
})();
</script>
</body>
</html>
