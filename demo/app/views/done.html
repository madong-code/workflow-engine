<!-- 我的已办：列表 + 搜索过滤 + 分页；详情右侧抽屉（时间线 + 流程图）；展示提交类型/审批意见/实例状态 -->
<section class="page" data-page="done">
  <div class="toolbar">
    <h2>我的已办</h2>
    <span class="muted">当前用户：<span id="doneUser" class="muted"></span></span>
    <input class="search-input" id="doneSearch" placeholder="搜索流程名...">
    <button class="btn" id="btnReloadDone">刷新</button>
  </div>
  <div id="doneList"></div>
</section>
<script>
(function () {
  'use strict';
  const A = window.App;
  const S = { rows: [], keyword: '' };
  let tbl;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function filtered() {
    const kw = S.keyword.trim().toLowerCase();
    if (!kw) return S.rows;
    return S.rows.filter((t) =>
      ((t.instance_display_name || '') + (t.display_name || '') + (t.task_name || '')).toLowerCase().includes(kw)
    );
  }

  function render() {
    tbl.update(filtered(), S.keyword ? '没有匹配的已办' : '当前用户暂无已办');
  }

  async function loadDones() {
    document.getElementById('doneUser').textContent = A.userLabel(A.state.operator);
    try {
      S.rows = await A.api('/dones?operator=' + encodeURIComponent(A.state.operator));
      render();
    } catch (err) {
      A.message('已办加载失败：' + err.message, 'error');
      tbl.update([], err.message);
    }
  }

  function init() {
    if (window.__doneInited) return;
    window.__doneInited = true;

    tbl = A.mountTable(document.getElementById('doneList'), {
      id: 'done',
      empty: '当前用户暂无已办',
      cols: [[
        { title: '任务', minWidth: 280, templet: (t) =>
            '<strong>' + esc(t.display_name || t.task_name) + '</strong>'
            + (t.delegated_from ? '<br><span class="badge info">受托自 ' + esc(A.userLabel(t.delegated_from)) + '</span>' : '') },
        { title: '流程', minWidth: 120, templet: (t) => esc(t.instance_display_name || '-') },
        { title: '提交类型', width: 90, templet: (t) => (t.submit_type ? esc(A.SUBMIT_TYPES[t.submit_type] || t.submit_type) : '-') },
        { title: '审批意见', minWidth: 160, templet: (t) => '<span class="wrap-cell">' + esc(t.comment || '-') + '</span>' },
        { title: '办理时间', width: 150, templet: (t) => '<span class="muted">' + A.fmtTime(t.finish_time) + '</span>' },
        { title: '实例状态', width: 96, templet: (t) => A.badge(A.INSTANCE_STATES, t.instance_state) },
        { title: '操作', width: 168, templet: (t) =>
            '<button class="btn sm" lay-event="detail" data-detail="' + (t.process_instance_id || '') + '"'
            + (t.process_instance_id ? '' : ' disabled') + '>详情</button>' },
      ]],
      onTool: (obj) => {
        if (obj.event !== 'detail' || !obj.data.process_instance_id) return;
        DetailDrawer.openInstance(obj.data.process_instance_id).catch((err) => A.message('详情加载失败：' + err.message, 'error'));
      },
    });

    document.getElementById('doneSearch').addEventListener('input', (e) => {
      S.keyword = e.target.value;
      render();
    });
    document.getElementById('btnReloadDone').addEventListener('click', loadDones);
  }

  async function reload() {
    init();
    await loadDones();
  }

  App.registerPage('done', { reload });
})();
</script>
