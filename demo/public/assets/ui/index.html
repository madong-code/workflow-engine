<!DOCTYPE html>
<!--
  workflow demo · 流程设计器静态站点（可被任意宿主 iframe 远程嵌入）

  依赖（vendor/ 内本地文件，零联网）：
    - vue.global.prod.js      Vue 3 全局构建
    - visual-flow.umd.cjs     visual-flow UMD 产物（LogicFlow 已打包内置，仅 external vue）
    - style.css               visual-flow 样式（含主题变量）

  UMD 工厂签名 factory(global2.FlowDesigner = {}, global2.vue)，
  Vue 官方全局构建挂 window.Vue，故需 window.vue = window.Vue 桥接。

  URL 参数：
    - mode         画布模式 canvas | dingtalk（默认 canvas）
    - viewer       1 = 查看模式（预览/高亮，隐藏拖拽面板）
    - targetOrigin 覆盖 postMessage 目标 origin（默认 '*'）

  postMessage 协议（iframe → parent）：
    - {type: 'flow.ready'}                          设计器就绪（宿主收到后才能 flow.load）
    - {type: 'flow.save', data: <FDConfigData>}     控制面板保存按钮触发

  postMessage 协议（parent → iframe）：
    - {type: 'flow.load', data: <FDConfigData>, mode?, viewer?, highLight?}   载入流程图
    - {type: 'flow.highlight', data: <FDHighLightType>}                       更新高亮
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流程设计器 · madong/workflow demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./vendor/style.css">
  <style>
    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #app .visual-flow,
    #app .flow-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <visual-flow
      :key="`${viewer}-${mode}`"
      :value="graphData"
      :mode="mode"
      :viewer="viewer"
      :high-light="highLight"
      :init-dnd-panel="!viewer"
      @on-init="onInit"
      @on-save="onSave"
    />
  </div>

  <script src="./vendor/vue.global.prod.js"></script>
  <!-- UMD external 桥接必须在 visual-flow 求值之前执行（工厂签名 factory(global2.FlowDesigner = {}, global2.vue)） -->
  <script>window.vue = window.Vue;</script>
  <script src="./vendor/visual-flow.umd.cjs"></script>
  <script>

    const params = new URLSearchParams(window.location.search);
    const TARGET_ORIGIN = params.get('targetOrigin') || window.DESIGNER_TARGET_ORIGIN || '*';

    const { createApp, ref } = window.Vue;

    const app = createApp({
      setup() {
        const graphData = ref({});
        const mode = ref(params.get('mode') === 'dingtalk' ? 'dingtalk' : 'canvas');
        const viewer = ref(params.get('viewer') === '1');
        const highLight = ref({});

        function postToHost(message) {
          const target = window.parent !== window ? window.parent : window.opener;
          if (target) {
            target.postMessage(message, TARGET_ORIGIN);
          }
        }

        // 设计器就绪：通知宿主可以 flow.load
        function onInit() {
          postToHost({
            type: 'flow.ready',
            mode: mode.value,
            viewer: viewer.value,
          });
        }

        // 控制面板保存按钮 → 回传宿主
        function onSave(data) {
          postToHost({ type: 'flow.save', data });
        }

        window.addEventListener('message', (event) => {
          const msg = event.data;
          if (!msg || typeof msg !== 'object') {
            return;
          }
          if (msg.type === 'flow.load') {
            if (msg.mode === 'canvas' || msg.mode === 'dingtalk') {
              mode.value = msg.mode;
            }
            if (typeof msg.viewer === 'boolean') {
              viewer.value = msg.viewer;
            }
            if (msg.highLight && typeof msg.highLight === 'object') {
              highLight.value = msg.highLight;
            }
            graphData.value = msg.data && typeof msg.data === 'object' ? msg.data : {};
          } else if (msg.type === 'flow.highlight') {
            highLight.value = msg.data && typeof msg.data === 'object' ? msg.data : {};
          }
        });

        return { graphData, mode, viewer, highLight, onInit, onSave };
      },
    });

    // UMD 导出为命名空间对象 { LogicFlow, LogicFlowCore, LogicFlowExtension, default }，
    // Vue 插件对象（含 install，注册 VisualFlow 组件）在 default 上
    app.use(window.FlowDesigner.default);
    app.mount('#app');
  </script>
</body>
</html>
